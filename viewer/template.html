<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>repoviz</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #161b22;
      --surface-2: #21262d;
      --border: #30363d;
      --text: #e2e8f0;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --radius: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* ── Summary Bar ── */
    #summary-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 36px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 16px;
      z-index: 100;
      font-size: 12px;
      color: var(--text-muted);
      overflow: hidden;
    }
    #summary-bar .sep { color: var(--border); }
    #summary-bar strong { color: var(--text); }
    #summary-repo { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Graph Canvas ── */
    #graph-canvas {
      position: fixed;
      top: 36px; left: 0;
      width: 100vw;
      height: calc(100vh - 36px);
      cursor: grab;
    }
    #graph-canvas:active { cursor: grabbing; }

    /* ── Left Panel (filters + legend) ── */
    #left-panel {
      position: fixed;
      top: 44px; left: 8px;
      width: 200px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 50;
      max-height: calc(100vh - 52px);
      overflow-y: auto;
    }

    .panel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
    }
    .panel-card h4 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    /* ── Filter Panels ── */
    .filter-option {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 0;
      cursor: pointer;
      color: var(--text);
      font-size: 12px;
    }
    .filter-option input[type="checkbox"] {
      accent-color: var(--accent);
      width: 13px; height: 13px;
      cursor: pointer;
    }
    .filter-swatch {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Search Bar ── */
    #search-bar {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #search-input {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 12px;
      padding: 4px 8px;
      outline: none;
    }
    #search-input:focus { border-color: var(--accent); }
    #search-input::placeholder { color: var(--text-muted); }
    #search-clear {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 0 2px;
      line-height: 1;
    }
    #search-clear:hover { color: var(--text); }

    /* ── Clear Filters Button ── */
    #clear-filters {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      padding: 5px 8px;
      text-align: center;
    }
    #clear-filters:hover { color: var(--text); border-color: var(--text-muted); }

    /* ── Legend ── */
    #legend { font-size: 11px; }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 0;
      color: var(--text);
    }
    .legend-node-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .legend-edge-line {
      width: 24px; height: 2px;
      flex-shrink: 0;
      border-radius: 1px;
    }

    /* ── Sidebar ── */
    #sidebar {
      position: fixed;
      top: 36px; right: 0;
      width: 320px;
      height: calc(100vh - 36px);
      background: #0d1117;
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform 0.25s ease;
      overflow-y: auto;
      z-index: 200;
      padding: 16px;
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar h2 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      padding-right: 24px;
      word-break: break-word;
    }
    #sidebar-close {
      position: absolute;
      top: 14px; right: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }
    #sidebar-close:hover { color: var(--text); }
    .meta-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
    .meta-table td { padding: 3px 0; font-size: 12px; vertical-align: top; }
    .meta-table td:first-child { color: var(--text-muted); width: 100px; }
    .meta-badge {
      display: inline-block;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 11px;
    }
    #sidebar-description {
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .rel-section { margin-bottom: 12px; }
    .rel-section h4 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .rel-type-group { margin-bottom: 8px; }
    .rel-type-label {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .rel-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 3px 0;
      font-size: 12px;
    }
    .navigate-btn {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 12px;
      text-align: left;
      padding: 0;
      text-decoration: underline;
      text-decoration-color: transparent;
    }
    .navigate-btn:hover { text-decoration-color: var(--accent); }
    .rel-evidence { color: var(--text-muted); font-size: 11px; flex-shrink: 0; }
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 12px 0;
    }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed;
      pointer-events: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      font-size: 12px;
      max-width: 280px;
      opacity: 0;
      transition: opacity 0.1s;
      z-index: 300;
      line-height: 1.5;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .tt-name { font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .tt-desc { color: var(--text-muted); margin-bottom: 4px; }
    .tt-meta { color: var(--text-muted); font-size: 11px; }
    .tt-meta span { color: var(--text); }

    /* ── Reset Layout Button ── */
    #reset-layout {
      position: fixed;
      bottom: 16px; right: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      padding: 8px 14px;
      z-index: 50;
      transition: color 0.15s, border-color 0.15s;
    }
    #reset-layout:hover { color: var(--text); border-color: var(--text-muted); }

    /* ── Empty / Error States ── */
    #empty-state, #error-overlay {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: var(--text-muted);
      z-index: 400;
    }
    #empty-state h2, #error-overlay h2 {
      font-size: 18px;
      margin-bottom: 8px;
      color: var(--text);
    }
    #empty-state p, #error-overlay p {
      font-size: 13px;
      max-width: 360px;
      line-height: 1.6;
    }
    #error-overlay h2 { color: #f87171; }

    /* ── Node highlight ring ── */
    .highlight-ring {
      fill: none;
      stroke: #f8fafc;
      stroke-width: 3;
      pointer-events: none;
      animation: ring-fade 2s ease forwards;
    }
    @keyframes ring-fade {
      0%   { opacity: 1; }
      60%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ── Edge pulse animation ── */
    @keyframes dash-flow {
      from { stroke-dashoffset: 24; }
      to   { stroke-dashoffset: 0; }
    }
    .edge { animation: dash-flow linear infinite; }

    /* ── Node labels ── */
    .node-label {
      font-size: 11px;
      fill: #cbd5e1;
      text-anchor: middle;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>

  <!-- Summary Bar -->
  <div id="summary-bar">
    <span id="summary-repo">—</span>
    <span class="sep">|</span>
    <span><strong id="summary-nodes">0</strong> nodes</span>
    <span><strong id="summary-edges">0</strong> edges</span>
    <span class="sep">|</span>
    <span id="summary-harnesses">—</span>
  </div>

  <!-- Graph Canvas -->
  <svg id="graph-canvas">
    <defs id="arrow-defs"></defs>
    <g id="graph-root">
      <g id="edge-layer"></g>
      <g id="node-layer"></g>
    </g>
  </svg>

  <!-- Left Panel -->
  <div id="left-panel">

    <!-- Search -->
    <div class="panel-card">
      <h4>Search</h4>
      <div id="search-bar">
        <input id="search-input" type="text" placeholder="Search nodes…" autocomplete="off" />
        <button id="search-clear" title="Clear search">✕</button>
      </div>
    </div>

    <!-- Harness Filter -->
    <div class="panel-card" id="harness-filter-card">
      <h4>Harnesses</h4>
      <div id="harness-checkboxes"></div>
    </div>

    <!-- Category Filter -->
    <div class="panel-card" id="category-filter-card">
      <h4>Categories</h4>
      <div id="category-checkboxes"></div>
    </div>

    <!-- Clear Filters -->
    <button id="clear-filters">Clear Filters</button>

    <!-- Legend -->
    <div class="panel-card">
      <h4>Legend</h4>
      <div id="legend"></div>
    </div>

  </div>

  <!-- Sidebar -->
  <div id="sidebar">
    <button id="sidebar-close" title="Close">✕</button>
    <div id="sidebar-content"></div>
  </div>

  <!-- Tooltip -->
  <div id="tooltip"></div>

  <!-- Reset Layout -->
  <button id="reset-layout">↺ Reset Layout</button>

  <!-- DATA_INJECTION_POINT -->
  <!-- BUNDLE_INJECTION_POINT -->

</body>
</html>
